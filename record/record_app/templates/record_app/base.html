{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Record - Uproszczona Wersja{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div>
            <a href="{% url 'home' %}" style="font-weight: bold; font-size: 1.2rem;">Record</a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="nav-avatar-wrap" style="margin-left:1rem;">
                    <img src="{{ user.avatar_url }}" alt="{{ user.username }}" class="avatar avatar-sm">
                    <strong>{{ user.username }}</strong>
                </a>
                <a href="{% url 'private_conversations' %}">💬 Wiadomości</a>
                <a href="{% url 'logout' %}">Wyloguj się</a>
            {% else %}
                <a href="{% url 'login' %}">Logowanie</a>
                <a href="{% url 'register' %}">Rejestracja</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
